<style>
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased}
  html,body{margin:0;background:#d8d8d8}
  body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#1B1915}

  .poster{position:relative;width:1080px;overflow:hidden;background:var(--bg);display:none}
  .poster.show{display:block}
  .p9x16{height:1920px}
  .p3x4{height:1440px}

  .deco{position:absolute;border-radius:50%;opacity:.55;pointer-events:none}
  .d1{width:560px;height:560px;right:-210px;top:-240px;background:radial-gradient(circle at 35% 35%,var(--acs),transparent 68%)}
  .d2{width:460px;height:460px;left:-190px;bottom:180px;background:radial-gradient(circle at 60% 40%,var(--acs),transparent 68%)}
  .d3{width:320px;height:320px;right:-80px;bottom:-70px;background:radial-gradient(circle at 40% 60%,var(--acs),transparent 68%)}

  .brand{position:absolute;display:flex;align-items:center;gap:16px;z-index:6}
  .appicon{border-radius:22%;box-shadow:0 10px 24px rgba(27,25,21,.20);display:block}
  .brand .name{font-size:38px;font-weight:700;letter-spacing:1px;white-space:nowrap}
  .brand .name small{font-size:22px;font-weight:600;color:#6E675C;margin-left:8px;letter-spacing:2px}
  .tag{position:absolute;right:56px;top:58px;font-size:25px;font-weight:600;color:var(--ac);
       border:2px solid var(--ac);border-radius:999px;padding:8px 22px;background:rgba(255,255,255,.55);z-index:6}

  .eyebrow{position:absolute;border-radius:999px;background:var(--ac);color:#fff;font-weight:700;
           display:inline-flex;align-items:center;letter-spacing:4px;z-index:6}
  .title{position:absolute;z-index:6;font-weight:700;line-height:1.1;white-space:nowrap}
  .title .hl{color:var(--ac)}
  .lede{position:absolute;z-index:6;font-weight:500;color:#4F4A3E;line-height:1.5}

  .phone{position:absolute;border-radius:56px;background:#14171C;padding:10px;
         box-shadow:0 34px 74px rgba(27,25,21,.28);z-index:4}
  .phone .screen{border-radius:48px;overflow:hidden;display:block;background:#F8F6F1}
  .phone img{display:block;width:100%;height:auto}

  .note{position:absolute;background:#fff;border-radius:22px;padding:18px 20px;
        box-shadow:0 10px 26px rgba(27,25,21,.10);z-index:6}
  .note b{font-size:29px;font-weight:700;display:flex;align-items:center;gap:10px;line-height:1.25}
  .note b i{width:13px;height:13px;border-radius:50%;background:var(--ac);flex:none}
  .note p{font-size:26px;color:#585243;margin:6px 0 0;line-height:1.35}

  .bignum{position:absolute;z-index:6}
  .bignum .n{font-weight:700;color:var(--ac);line-height:1;letter-spacing:-2px}
  .bignum .c{color:#6E675C;margin-top:10px}

  .chips{position:absolute;display:flex;justify-content:center;gap:16px;z-index:6}
  .chips span{height:56px;border-radius:999px;background:#fff;display:flex;align-items:center;padding:0 24px;
              font-size:26px;font-weight:600;color:#3F3B31;box-shadow:0 6px 16px rgba(27,25,21,.08)}

  .cta{position:absolute;border-radius:26px;background:var(--ac);display:flex;flex-direction:column;
       align-items:center;justify-content:center;gap:5px;z-index:6;box-shadow:0 16px 34px rgba(27,25,21,.22)}
  .cta b{color:#fff;font-weight:700;letter-spacing:1px}
  .cta span{color:rgba(255,255,255,.9)}

<body>
<div id="stage"></div>
<script>
const DATA = [
  { n:1, layout:'a', shot:'shot-01.png', ac:'#0A7A61', bg:'#EAF7F2', acs:'rgba(10,122,97,.17)',
    eyebrow:'屏幕洞察', l1:'时间都去哪了', l2:'全都看清',
    notes:[['日周月趋势','随时翻回去'],['双柱对比','屏幕 vs 专注']], float:['应用排行','谁最耗时间'] },

  { n:2, layout:'b', shot:'shot-02.png', ac:'#E8930C', bg:'#FFF6E9', acs:'rgba(232,147,12,.18)',
    eyebrow:'专注计时', l1:'翻开书就', l2:'想摸手机？', lede:'25 分钟，只做一件事。' },

  { n:3, layout:'c', shot:'shot-03.png', ac:'#D6568A', bg:'#FCEFF4', acs:'rgba(214,86,138,.16)',
    eyebrow:'应用限额', l1:'短视频', l2:'说停就停',
    notes:[['逐个设定','每个 App 单独'],['到点提醒','只提醒一次']] },

  { n:4, layout:'d', shot:'shot-05.png', ac:'#3E63DD', bg:'#EEF1FC', acs:'rgba(62,99,221,.16)',
    eyebrow:'桌面小部件', l1:'不用点开', l2:'抬眼就知道',
    notes:[['两种尺寸','2×2 与 4×1'],['自动刷新','数据总是新的'],['零打扰','不推送不弹窗']] },

  { n:5, layout:'e', shot:'shot-04.png', ac:'#7C6BD9', bg:'#F2EFFC', acs:'rgba(124,107,217,.16)',
    eyebrow:'每周回顾', l1:'一周结束', l2:'看清节奏',
    bignum:'4 小时 18 分', bigcap:'本周专注累计（相当于两集剧）',
    notes:[['双柱对比','屏幕与专注'],['趋势变化','比上周强吗']] },

  { n:6, layout:'f', shot:'shot-06.png', ac:'#08624E', bg:'#E9F1EE', acs:'rgba(8,98,78,.16)',
    eyebrow:'隐私与免费', l1:'没有账号', l2:'数据在本地',
    lede:'不注册、不上传、不追踪。所有记录只存在你的手机里。' },
];

const q = new URLSearchParams(location.search);
const wantP = q.get('p') ? +q.get('p') : null;
const sizeCls = q.get('size') === '34' ? 'p3x4' : 'p9x16';

document.getElementById('stage').innerHTML = DATA.map(d => {
  const notes = (d.notes || []).map(([b, p], i) => `<div class="note note-${i + 1}"><b><i></i>${b}</b><p>${p}</p></div>`).join('');
  const float = d.float ? `<div class="note note--float"><b><i></i>${d.float[0]}</b><p>${d.float[1]}</p></div>` : '';
  const bignum = d.bignum ? `<div class="bignum"><div class="n">${d.bignum}</div><div class="c">${d.bigcap}</div></div>` : '';
  const lede = d.lede ? `<div class="lede">${d.lede}</div>` : '';
  const show = (!wantP || wantP === d.n) ? 'show' : '';
  return `
  <div class="poster ${sizeCls} layout-${d.layout} ${show}" id="p${d.n}"
       style="--ac:${d.ac};--bg:${d.bg};--acs:${d.acs}">
    <div class="deco d1"></div><div class="deco d2"></div><div class="deco d3"></div>

    <div class="brand">
      <img class="appicon" src="assets/icon-256.png" alt="留白">
      <span class="name">「留白」<small>Margin</small></span>
    </div>
    <div class="tag">#大学生的时间管理</div>

    <div class="eyebrow">${d.eyebrow}</div>
    <div class="title"><div>${d.l1}</div><div><span class="hl">${d.l2}</span></div></div>
    ${lede}
    ${bignum}

    <div class="phone"><div class="screen"><img src="shots/${d.shot}" alt="${d.eyebrow}"></div></div>

    ${notes}
    ${float}

    <div class="chips"><span>完全免费</span><span>无广告</span><span>数据只存本机</span></div>
    <div class="cta"><b>下载「留白」</b><span>写给总在刷手机的大学生</span></div>
  </div>`;
}).join('');
</script>
